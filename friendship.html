
<!DOCTYPE html>
<html>
<head>
    <title>Birthday Surprise 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 35px 20px;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 5px 25px #0003;
        }

        h1 {
            color: #ff4081;
            margin-bottom: 20px;
        }

        h2 {
            color: #e91e63;
            margin: 15px;
        }

        .cake {
            font-size: 100px;
            animation: bounce 1s infinite alternate;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin: 20px 0;
        }

        button {
            background: #ff4081;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 10px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #c2185b;
        }

        #surprise {
            color: #ff4081;
            margin: 20px;
        }

        #qrcode {
            margin: 20px auto;
        }

        footer {
            margin-top: 25px;
            color: gray;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-15px);
            }
        }

        .heart {
            font-size: 25px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎉 Happy Birthday! 🎉</h1>

        <h2>Dear Best Friend ❤️</h2>

        <div class="cake">🎂</div>

        <p>
            Wishing you a day filled with happiness,
            laughter, love and beautiful memories!
            May all your dreams come true.
        </p>

        <button onclick="showSurprise()">
            Click for Surprise 🎁
        </button>

        <h2 id="surprise"></h2>

        <button onclick="playMusic()">
            🎵 Play Music
        </button>

        <audio id="music" loop>
            <source src="birthday.mp3" type="audio/mpeg">
        </audio>

        <hr>

        <h2>Scan Birthday QR Code 📱</h2>

        <p>Scan this QR code to open the birthday website.</p>

        <div id="qrcode"></div>

        <footer>
            Made with ❤️ Just for You!
        </footer>

    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        function showSurprise() {

            document.getElementById("surprise").innerHTML =
            "💖 You are a wonderful person! " +
            "May your life be filled with endless happiness! 🎉🎂";

        }

        function playMusic() {

            let music = document.getElementById("music");

            music.play().catch(() => {
                alert("Please add birthday.mp3 to your project folder!");
            });

        }

        // Generate QR Code
        let websiteURL = window.location.href;

        new QRCode(document.getElementById("qrcode"), {
            text: websiteURL,
            width: 180,
            height: 180
        });

    </script>

</body>
</html>
